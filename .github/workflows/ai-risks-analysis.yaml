name: AI Code Risk & Compatibility Analysis (Gemini)

# Every pull request, whatever its base branch: a stacked pull request is reviewed against
# its own base.
on:
  pull_request:

permissions:
  contents: read

jobs:
  gemini-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to post the analysis as a pull request comment.
      pull-requests: write

    steps:
      # 1. Checkout PR code
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Keep the job token out of .git/config: later steps run third-party code on
          # text from the pull request. The repository is public, so fetching needs none.
          persist-credentials: false

      # 2. Get changed Java files and generate diff
      - name: Get changed files and diff
        id: changed
        # Event values reach the script as environment variables, never spliced into it:
        # any base branch is allowed, and a branch name could hold shell syntax.
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Base branch: $BASE_BRANCH"
          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          # Fetch the base branch explicitly to ensure it's available
          git fetch origin "$BASE_BRANCH" || true

          # Get changed Java files comparing base SHA to head SHA
          # Fallback to branch comparison if SHA comparison fails
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" 2>/dev/null | grep '\.java$' || \
                         git diff --name-only "origin/$BASE_BRANCH"...HEAD 2>/dev/null | grep '\.java$' || \
                         git diff --name-only "$BASE_BRANCH"...HEAD 2>/dev/null | grep '\.java$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Java files changed in this PR"
            echo "changed_files=" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changed Java files:"
            echo "$CHANGED_FILES"
            # Convert newlines to spaces for GitHub Actions output (multiline values cause issues)
            CHANGED_FILES_SPACE=$(echo "$CHANGED_FILES" | tr '\n' ' ' | xargs)
            echo "changed_files=$CHANGED_FILES_SPACE" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT

            # Generate unified diff for all changed Java files

            # Use the same fallback logic for diff generation
            # Try three-dot syntax first, then two-dot syntax
            git diff "$BASE_SHA"..."$HEAD_SHA" -- $CHANGED_FILES_SPACE > code_diff.txt 2>/dev/null || \
            git diff "$BASE_SHA..$HEAD_SHA" -- $CHANGED_FILES_SPACE > code_diff.txt 2>/dev/null || \
            git diff "origin/$BASE_BRANCH"...HEAD -- $CHANGED_FILES_SPACE > code_diff.txt 2>/dev/null || \
            git diff "origin/$BASE_BRANCH..HEAD" -- $CHANGED_FILES_SPACE > code_diff.txt 2>/dev/null || \
            git diff "$BASE_BRANCH"...HEAD -- $CHANGED_FILES_SPACE > code_diff.txt 2>/dev/null || \
            git diff "$BASE_BRANCH..HEAD" -- $CHANGED_FILES_SPACE > code_diff.txt 2>/dev/null || true

            if [ -s code_diff.txt ]; then
              echo "Generated diff file with $(wc -l < code_diff.txt) lines"
              echo "diff_file=code_diff.txt" >> $GITHUB_OUTPUT
            else
              echo "WARNING: Could not generate diff file"
              echo "Attempting alternative diff method..."
              # Try diffing each file individually and concatenating
              > code_diff.txt
              for file in $CHANGED_FILES_SPACE; do
                if [ -f "$file" ]; then
                  echo "=== $file ===" >> code_diff.txt
                  git diff "$BASE_SHA" "$HEAD_SHA" -- "$file" >> code_diff.txt 2>/dev/null || \
                  git diff "origin/$BASE_BRANCH" HEAD -- "$file" >> code_diff.txt 2>/dev/null || \
                  git diff "$BASE_BRANCH" HEAD -- "$file" >> code_diff.txt 2>/dev/null || true
                  echo "" >> code_diff.txt
                fi
              done

              if [ -s code_diff.txt ]; then
                echo "Generated diff file with $(wc -l < code_diff.txt) lines (alternative method)"
                echo "diff_file=code_diff.txt" >> $GITHUB_OUTPUT
              else
                echo "ERROR: Still could not generate diff file"
                echo "diff_file=" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      # 3. Install Gemini CLI, at an exact version and without install scripts.
      - name: Install Gemini CLI
        env:
          # The exact @google/gemini-cli release to install (0.62.0, 2026-09-29). Raise it
          # deliberately; the step fails rather than install a version that is not exact.
          GEMINI_CLI_VERSION: 0.62.0
        run: |
          if ! printf '%s' "$GEMINI_CLI_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Set GEMINI_CLI_VERSION in ai-risks-analysis.yaml to an exact @google/gemini-cli version"
            exit 1
          fi
          npm install -g --ignore-scripts "@google/gemini-cli@${GEMINI_CLI_VERSION}"

      # 4. Run Gemini AI
      - name: Run Gemini Analysis
        id: gemini
        if: steps.changed.outputs.has_changes == 'true' && steps.changed.outputs.diff_file != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Passed through the environment, not pasted into the script: file names come
          # from the pull request.
          DIFF_FILE: ${{ steps.changed.outputs.diff_file }}
          CHANGED_FILES: ${{ steps.changed.outputs.changed_files }}
        run: |

          if [ ! -f "$DIFF_FILE" ] || [ ! -s "$DIFF_FILE" ]; then
            echo "ERROR: Diff file not found or empty"
            echo "output_file=" >> $GITHUB_OUTPUT
            echo "exit_code=1" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Validate API key is set
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is not set"
            echo "output_file=" >> $GITHUB_OUTPUT
            echo "exit_code=1" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Analyzing diff for files: $CHANGED_FILES"
          echo "Diff file size: $(wc -l < "$DIFF_FILE") lines"

          # Create prompt file with diff content to avoid command line length issues
          {
            echo "Analyze the following code changes (unified diff) in Java files for: Security and performance risks, Null safety issues, Checked exception handling concerns, Deprecated API usage, Coding standard violations, Potential backward compatibility risks (API signature changes, public method removal/renaming, behavior changes affecting clients). Focus only on the changed lines (lines starting with + or -), not the entire files. Always provide severity (Low/Medium/High) and improvement suggestions as summary. Do not use tables for rendering - use plain text, bullet points, or code blocks instead."
            echo ""
            echo "Code changes (diff):"
            echo "\`\`\`diff"
            cat "$DIFF_FILE"
            echo "\`\`\`"
          } > gemini_prompt.txt

          # Feed the prompt and the diff on stdin: a diff passed as one argument fails above
          # the 128 KiB limit of a single argument. `set +e` keeps the step running when
          # Gemini fails, so that its exit code and the error details are reported.
          set +e
          gemini -p "Follow the instructions at the top of the input." < gemini_prompt.txt > gemini_output.txt 2>&1
          GEMINI_EXIT_CODE=$?
          set -e

          echo "Gemini CLI exit code: $GEMINI_EXIT_CODE"

          # Filter out potential API key exposure from output (security measure)
          if [ -f gemini_output.txt ]; then
            # Remove lines that might contain exposed API keys in error messages
            # Match patterns like: "api-key: xxx", "GEMINI_API_KEY=xxx", or long alphanumeric strings that look like keys
            sed -i.bak -E '/api[_-]?key[=:]\s*[a-zA-Z0-9_-]{20,}|GEMINI_API_KEY[=:]\s*[a-zA-Z0-9_-]{20,}/Id' gemini_output.txt 2>/dev/null || true
            rm -f gemini_output.txt.bak 2>/dev/null || true
          fi

          if [ $GEMINI_EXIT_CODE -ne 0 ]; then
            echo "WARNING: Gemini CLI failed"
            echo "" >> gemini_output.txt
            echo "--- Error Details ---" >> gemini_output.txt
            echo "Exit code: $GEMINI_EXIT_CODE" >> gemini_output.txt
            echo "Diff file: $DIFF_FILE ($(wc -l < "$DIFF_FILE") lines)" >> gemini_output.txt
          fi

          echo "output_file=gemini_output.txt" >> $GITHUB_OUTPUT
          echo "exit_code=$GEMINI_EXIT_CODE" >> $GITHUB_OUTPUT

      # 5. Post results to PR comment, with the GitHub CLI that the runner provides
      - name: Comment on PR with Gemini Findings
        if: steps.changed.outputs.changed_files != '' && steps.gemini.outputs.output_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTPUT_FILE: ${{ steps.gemini.outputs.output_file }}
          EXIT_CODE: ${{ steps.gemini.outputs.exit_code }}
          CHANGED_FILES: ${{ steps.changed.outputs.changed_files }}
        run: |
          STATUS_ICON='[OK]'
          STATUS_TEXT='Analysis completed successfully'
          if [ -f "$OUTPUT_FILE" ]; then
            ANALYSIS="$(cat "$OUTPUT_FILE")"
            if [ -z "$(printf '%s' "$ANALYSIS" | tr -d '[:space:]')" ]; then
              ANALYSIS='No analysis output was generated.'
              STATUS_ICON='[WARNING]'
              STATUS_TEXT='No output generated'
            elif [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "0" ]; then
              STATUS_ICON='[ERROR]'
              STATUS_TEXT="Analysis failed with exit code $EXIT_CODE"
            fi
          else
            ANALYSIS='Analysis output file was not found.'
            STATUS_ICON='[ERROR]'
            STATUS_TEXT='Output file not found'
          fi

          # Format files as bullet point list (no glob expansion of the names)
          set -f
          {
            echo "## Gemini AI Code Risk & Compatibility Analysis"
            echo
            echo "**Status:** $STATUS_ICON $STATUS_TEXT"
            echo
            echo "**Files analyzed:**"
            for file in $CHANGED_FILES; do
              echo "- \`$file\`"
            done
            echo
            echo "### Analysis Results"
            echo
            printf '%s\n' "$ANALYSIS"
          } > comment.md

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
